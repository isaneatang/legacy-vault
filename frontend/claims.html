<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legacy Vault — Claimable Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pirata+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <h1 class="page-title">Claimable <span class="accent">Assets</span></h1>
    <p class="page-sub">
      Every vault where this wallet is named as a beneficiary — what you're
      owed, and exactly when it unlocks.
    </p>

    <div id="claim-grid" class="grid-cards"></div>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 48 48" fill="none" stroke="#1FAA6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="20" width="28" height="18" rx="2"/>
        <path d="M24 26v6"/><circle cx="24" cy="26" r="3"/>
        <path d="M14 20v-4a10 10 0 0 1 20 0v4"/>
      </svg>
      <p id="empty-msg">No claimable assets.</p>
    </div>

    <div class="footer-note"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script type="module">
    import {
      state, initWallet, onWalletChange, wireHeader, readOnlyContract, signerContract,
      sendTx, toast, statusName, chipClass, ticker, fmtAmt, shortAddr, cleanErr, isSupportedChain,
    } from "./js/app.js";
    import { renderHeader } from "./js/layout.js";

    renderHeader();
    wireHeader("claims");

    const grid = document.getElementById("claim-grid");
    const empty = document.getElementById("empty-state");
    let renderGen = 0;

    async function render() {
      const gen = ++renderGen;
      if (!state.address) {
        grid.innerHTML = "";
        empty.hidden = false;
        document.getElementById("empty-msg").textContent = "Connect a wallet to view your claims.";
        return;
      }
      const c = readOnlyContract();
      let ids;
      try {
        ids = (await c.getVaultsByBeneficiary(state.address)).map(BigInt);
        if (gen !== renderGen) return;
      } catch (err) {
        if (gen !== renderGen) return;
        console.error(err);
        grid.innerHTML = "";
        empty.hidden = false;
        document.getElementById("empty-msg").textContent = isSupportedChain(state.chainId)
          ? "Couldn't read from the chain — check your connection and retry."
          : "Wrong network — switch your wallet to BOT Chain to load your claims.";
        return;
      }

      // The on-chain index is append-only: filter out ids where we're no longer a beneficiary.
      const live = [];
      for (const id of ids) {
        try {
          if (await c.isBeneficiary(id, state.address)) live.push(id);
        } catch {}
        if (gen !== renderGen) return;
      }

      if (!live.length) {
        grid.innerHTML = "";
        empty.hidden = false;
        document.getElementById("empty-msg").textContent = "No claimable assets.";
        return;
      }
      empty.hidden = true;
      grid.innerHTML = "";

      for (const id of live) {
        if (gen !== renderGen) return;
        try {
          const [v, claim] = await Promise.all([c.getVault(id), c.getClaimState(id, state.address)]);
          const myShareBps = await c.shareOf(id, state.address);
          if (gen !== renderGen) return;
          grid.insertAdjacentHTML("beforeend", cardHtml(id, v, claim, myShareBps));
          wireCountdown(id, v, claim);
          const btn = grid.querySelector(`[data-claim-t1="${id}"]`);
          if (btn) btn.addEventListener("click", () => claimT1(id));
          const fbtn = grid.querySelector(`[data-claim-final="${id}"]`);
          if (fbtn) fbtn.addEventListener("click", () => claimFinal(id));
          const tbtn = grid.querySelector(`[data-trigger="${id}"]`);
          if (tbtn) tbtn.addEventListener("click", () => triggerRelease(id));
        } catch (err) {
          console.error(err);
        }
      }
    }

    function cardHtml(id, v, claim, myShareBps) {
      const st = Number(v.status);
      let action = "";
      let phase = "";
      if (st === 0) {
        const dueAt = Number(BigInt(v.lastCheckIn) + BigInt(v.checkInInterval));
        const overdue = Date.now() / 1000 >= dueAt;
        if (overdue) {
          phase = "The owner missed their check-in. Trigger the release to start your claim — after the dispute window closes, you can claim your share.";
          action = `<button class="btn primary wide" data-trigger="${id}">Trigger Release</button>`;
        } else {
          phase = `Owner is active. If they miss their check-in after ${new Date(dueAt * 1000).toLocaleString()}, you'll be able to trigger the release and start claiming.`;
        }
      } else if (st === 1) {
        action = claim.canClaimT1
          ? `<button class="btn primary wide" data-claim-t1="${id}">Claim Tranche 1 — est. ${fmtAmt(claim.estimatedT1)} BOT</button>`
          : `<p style="color:var(--gold); margin:0">Dispute window open — tranche 1 unlocks when it closes.</p>`;
      } else if (st === 2) {
        if (claim.canClaimT1) {
          action += `<button class="btn primary wide" data-claim-t1="${id}" style="margin-bottom:8px">Claim Tranche 1 — est. ${fmtAmt(claim.estimatedT1)} BOT</button>`;
        }
        action += claim.canClaimFinal
          ? `<button class="btn primary wide" data-claim-final="${id}">Claim Final Share — est. ${fmtAmt(claim.estimatedFinal)} BOT</button>`
          : `<p style="color:var(--ash); margin:6px 0 0">Final share unlocks after one more full check-in interval of owner silence.</p>`;
      } else {
        action = claim.canClaimFinal
          ? `<button class="btn primary wide" data-claim-final="${id}">Claim Final Share — est. ${fmtAmt(claim.estimatedFinal)} BOT</button>`
          : `<p style="color:var(--ash-dim); margin:0">This vault is fully settled.</p>`;
      }

      return `
        <div class="panel vault-card glow" id="card-${id}">
          <div class="head">
            <span class="vault-id">Vault <span class="accent">#${id}</span><br/>
              <small>owner ${shortAddr(v.owner)}</small></span>
            <span class="chip ${chipClass(st)}${st === 1 ? " st-danger" : ""}">${statusName(st)}</span>
          </div>
          <div class="meta-row">
            <span>your share <b>${Number(myShareBps) / 100}%</b></span>
            <span>vault holds <b>${fmtAmt(v.balance)} BOT</b></span>
          </div>
          ${phase ? `<p style="color:var(--ash-dim); font-size:13px; margin:0">${phase}</p>` : ""}
          <div>
            <div class="countdown-label" id="cd-label-${id}"></div>
            <div class="countdown big-countdown" id="cd-${id}"></div>
          </div>
          <div style="margin-top:auto">${action}</div>
          <a href="detail.html?vault=${id}" style="font-size:13px">view vault details ↗</a>
        </div>`;
    }

    function wireCountdown(id, v, claim) {
      const el = document.getElementById(`cd-${id}`);
      const label = document.getElementById(`cd-label-${id}`);
      if (!el) return;
      ticker(el, (now) => {
        const st = Number(v.status);
        if (st === 0) {
          const remain = Number(BigInt(v.lastCheckIn) + BigInt(v.checkInInterval) - BigInt(now));
          label.textContent = "time until release can be triggered";
          el.textContent = remain > 0 ? fmtDuration(remain) : "ready — you can trigger now";
          el.className = "countdown";
        } else if (st === 1) {
          const remain = Number(BigInt(v.triggeredAt) + BigInt(v.disputeWindow) - BigInt(now));
          label.textContent = remain > 0 ? "time until you can claim tranche 1" : "";
          if (remain > 0) { el.textContent = fmtDuration(remain); el.className = "countdown warn"; }
          else { label.textContent = ""; el.textContent = "You can claim tranche 1 now"; el.className = "countdown"; }
        } else if (st === 2) {
          if (claim.canClaimT1) { label.textContent = "tranche 1"; el.textContent = "You can still claim tranche 1"; el.className = "countdown"; return; }
          const remain = Number(BigInt(v.tranche1ClaimedAt) + BigInt(v.checkInInterval) - BigInt(now));
          label.textContent = remain > 0 ? "time until final claim" : "";
          if (remain > 0) { el.textContent = fmtDuration(remain); el.className = "countdown warn"; }
          else { label.textContent = ""; el.textContent = "You can claim your final share now"; el.className = "countdown"; }
        } else {
          label.textContent = "vault";
          el.textContent = claim.canClaimFinal ? "settled — claim your share" : "fully released";
          el.className = "countdown";
        }
      });
    }

    async function triggerRelease(id) {
      try {
        const c = await signerContract();
        await sendTx(`Trigger release #${id}`, c.triggerRelease(id));
        render();
      } catch (err) {
        console.error(cleanErr(err));
      }
    }

    async function claimT1(id) {
      try {
        const c = await signerContract();
        await sendTx(`Tranche 1 claim #${id}`, c.claimTranche1(id));
        render();
      } catch (err) {
        console.error(cleanErr(err));
      }
    }
    async function claimFinal(id) {
      try {
        const c = await signerContract();
        await sendTx(`Final claim #${id}`, c.claimFinal(id));
        render();
      } catch (err) {
        console.error(cleanErr(err));
      }
    }

    initWallet().then(render).catch(console.error);
    onWalletChange(() => render());
  </script>
</body>
</html>
